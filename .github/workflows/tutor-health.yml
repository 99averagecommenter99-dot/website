name: Tutor health check

on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutor-health:
    name: Verify production tutor answers
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe production tutor
        run: node scripts/check-tutor-health.js
        env:
          STEPWISE_SITE_URL: https://website-seven-sandy-12.vercel.app
